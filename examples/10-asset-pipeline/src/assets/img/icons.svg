<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- One file, two icons. A page names an icon as `img/icons.svg#<id>`: the
       file is what the build copied and the fragment is what the browser
       draws, which is why {{asset}} splits the two before it looks anything
       up. `currentColor` lets the surrounding text colour the icon. -->
  <symbol id="bean" viewBox="0 0 24 24">
    <path
      d="M12 2c4.4 2.2 7 5.4 7 10s-2.6 7.8-7 10c-4.4-2.2-7-5.4-7-10s2.6-7.8 7-10Z"
      fill="currentColor" />
    <path d="M12 2.8c-2.2 4.4-2.2 14 0 18.4" fill="none" stroke="#fff"
      stroke-width="1.4" stroke-linecap="round" opacity="0.65" />
  </symbol>
  <symbol id="leaf" viewBox="0 0 24 24">
    <path
      d="M20 3c-9.4 0-15 4.8-15 12 0 1.3.2 2.5.6 3.6C7.4 11.9 12.2 8.3 18.6 7.2 13.6 9.4 9.7 13 8 20c8.2 0 12-6.2 12-17Z"
      fill="currentColor" />
  </symbol>
</svg>
