name: ci

on:
  pull_request:
    branches: [main, v2]
  push:
    branches: [main, v2]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The format gate diffs against the base branch, which needs history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run gates
